# licencia permite publicarlas en la web, el sitio usa Newsreader y Space Grotesk.
# Para activarlas: copiar los .woff2 a assets/fede/assets/fonts/web/ y poner true.
fuentes_marca: false

repositorio: https://www.repository.fedesarrollo.org.co
sitio_anterior: https://www.fedesarrollo.org.co

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/fede/og-image.jpg
  - scope:
      path: "documentos-politica-2026-2030"
    values:
      nav: investigaciones
      image: /documentos-politica-2026-2030/assets/img/og-image.png
  - scope:
      path: "documentos-politica-2026-2030/docs"
    values:
      layout: serie-doc
      js:
        - /documentos-politica-2026-2030/assets/serie.js

exclude:
  - README.md
  - COMO-EDITAR.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - documentos-politica-2026-2030/COMO-AGREGAR-UN-DOCUMENTO.md
  - productividad-mercado-laboral/README.md
