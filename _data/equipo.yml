  cv: "https://drive.google.com/file/d/1dweFSU8e7nnPcPTVlbCIzKZ92UqktAlK/view?usp=sharing"
  bio:
    - "Economista de la Universidad de los Andes y Doctor en Historia Universidad Torcuato di Tella Buenos Aires – Argentina. Graduado de Maestría en Administración Pública de la Universidad Autónoma de Barcelona y tiene una Especialización en Análisis Económico y Política Financiera. Programa del Instituto del Fondo Monetario Internacional. Washington."
    - "Con amplia experiencia en gestión financiera pública, análisis financiero de gobiernos territoriales y la descentralización. Para Colombia hace seguimiento permanente de los ingresos de los territorios, de la sostenibilidad de las finanzas subnacionales, de los sistemas de transferencias intergubernamentales y del impacto de los recursos del sector minero energético. Consultor internacional de los mismos temas, en gestión pública financiera y en las finanzas de la salud, saneamiento básico y medio ambiente, entre otros. Ha sido profesor universitario en finanzas públicas e historia económica de Colombia, entre otras áreas."

- nombre: "Juan José Echavarría"
  cargo: "Investigador asociado"
  grupo: investigacion
  area: ""
  slug: juan-jose-echavarria
  firmas: ["Juan J. Echavarría", "Juan José Echavarría"]
  foto: "https://res.cloudinary.com/dleuipkoh/image/upload/v1677557126/Personas/captura_de_pantalla_2021-09-02_a_las_9.18.39_a._m_jw3wtg.png"
  correo: jechavarria@fedesarrollo.org.co
  cv: "https://drive.google.com/file/d/1148tXoJALC2oyLrWhKrUzpon85KDpUKh/view?usp=drive_link"
  bio:
    - "Gerente general del Banco de la República desde 2017 hasta 2021. Previamente había sido codirector del emisor entre 2003 y 2013. Fue Director Ejecutivo de Fedesarrollo entre 1998 y 2003, y Subdirector de la misma entidad en 1989‐90. Dentro de su amplio recorrido profesional cuenta con haber sido director de investigaciones económicas de la Federación Nacional de Cafeteros (1990-1992), Ministro Plenipotenciario de Colombia en la OEA y Viceministro de Comercio (1994-1998). Echavarría es ingeniero de la Universidad Nacional, con posgrados en las universidades de Harvard y Boston, y Doctor en economía de la Universidad de Oxford. Su trabajo académico se ha centrado en temas relacionados con la política monetaria y cambiaria, con el proceso de industrialización, la integración económica, y el comercio internacional. Ha dictado cátedras de Macroeconomía, Econometría y Comercio Internacional en las Universidades de Oxford, Los Andes, Nacional, Rosario, Externado y Javeriana."

