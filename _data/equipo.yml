  correo: mdruiz@fedesarrollo.org.co
  bio:
    - "Economista y Magister en Economía de la Universidad de los Andes, con Estudios Doctorales en Economía en la Universidad de París 1 -Panthéon Sorbonne. Más de 35 años de experiencia en diseño y evaluación de políticas públicas y ejecución de programas y proyectos de desarrollo rural, economía agraria, desarrollo sostenible, agricultura y ganadería climáticamente inteligentes, negocios inclusivos, agronegocios, asociatividad, alianzas público-privadas entre organizaciones de pequeños productores y la empresa privada, e innovación y desarrollo tecnológico para el desarrollo del sector agropecuario. Profesional que ha liderado grandes equipos para la construcción de una sociedad más equitativa y sostenible, en particular como Viceministra de Asuntos Agropecuarios y Gerente del Instituto Colombiano Agropecuario -ICA-. Actualmente, es Directora del Proyecto Impulso Verde “Unlocking AFOLU green finance capacity in Colombia” financiado por UK PACT y ejecutado por Fedesarrollo."

- nombre: "Sandra Oviedo"
  cargo: "Investigadora asociada"
  grupo: investigacion
  area: ""
  slug: sandra-oviedo
  firmas: ["Sandra Oviedo"]
  foto: "https://res.cloudinary.com/dleuipkoh/image/upload/v1677557855/Personas/so_0_zbqxsv.png"
  correo: soviedo@fedesarrollo.org.co
  cv: "https://drive.google.com/file/d/1HZMRaQEbdQkZiXRAFKgrSQxq7WV8M0gv/view?usp=drive_link"
  bio:
    - "Sandra Oviedo Ariza es Economista y Magíster en Ciencias Económicas de la Universidad Nacional de Colombia. Cuenta con más de 10 años de experiencia en consultoría, investigación y apoyo a políticas públicas. Sus principales áreas de trabajo son el comercio exterior y la economía internacional, el desarrollo productivo y los análisis sectoriales, el sector agropecuario, el análisis de competencia, y el consumo cultural, entre otras."
    - "Actualmente es Investigadora de Fedesarrollo, entidad a la que ha estado vinculada en diferentes ocasiones desde el año 2007. Anteriormente fue Coordinadora de Economía Naranja, Turismo y Servicios, en el Departamento Nacional de Planeación, y Consultora del Programa de Apoyo a la Implementación de la Política Nacional Logística de la misma entidad. Se desempeñó como investigadora en la Universidad Nacional de Colombia en la realización de evaluaciones económicas de costo efectividad de tecnologías sanitarias."
    - "Ha publicado, en coautoría, diferentes artículos y capítulos de libros en temas asociados con la política comercial agrícola, el aprovechamiento de Tratados de Libre Comercio, las relaciones comerciales de Colombia con Asia, la diversificación de las exportaciones, entre otros."

- nombre: "Sandra Zuluaga"
  cargo: "Investigadora asociada"
  grupo: investigacion
  area: ""
  slug: sandra-zuluaga
  firmas: ["Sandra Zuluaga"]
  foto: "https://res.cloudinary.com/dleuipkoh/image/upload/t_Try1/v1705417374/Personas/_DSC0022_p98fjm.jpg"
  cv: "https://drive.google.com/file/d/1TblWvOfSJH31PvOfAJ6rZTMDRycRQJqm/view?usp=sharing"
  bio:
    - "Economista con Máster en Desarrollo Económico de la Universidad de los Andes. Ha sido investigadora asociada e investigadora externa de Fedesarrollo y recientemente fue socia consultora de Axia Colombia Valor Integral. Cuenta con más de 20 años de experiencia en consultoría económica para empresas y entidades de gobierno en Colombia, y también se ha desempeñado como consultora para el BID y el Banco Mundial. Desde Axia ha liderado proyectos de investigación cualitativa para empresas y organizaciones sobre manejo del entorno, relacionamiento con grupos de interés, caracterización socioeconómica y gestión de riesgos, en los que también se combina el uso de herramientas cuantitativas."
    - "Estuvo vinculada a Kreab, empresa multinacional de comunicaciones estratégicas, como Head of Research y previamente, fue socia directora de LEXIA, empresa de investigaciones de mercado y opinión, donde lideró proyectos de estudio cualitativos relacionados con innovación y percepción de políticas públicas. En Fedesarrollo ha trabajado en proyectos relacionados con economía internacional, competitividad, inversión extranjera, servicios financieros y microseguors, y recientemente ha trabajado en evaluación de procesos de mecanismos de Financiación Basada en Resultados como Bonos de Impacto Social y Contratos Basados en Desempeño. Ha sido consultora en proyectos de inteligencia de mercados y prácticas comerciales anticompetitivas y trabajó en el Ministerio de Comercio, Industria y Turismo en la implementación de distintos acuerdos comerciales suscritos por Colombia como asesora del viceministro y del director de estudios sectoriales."

