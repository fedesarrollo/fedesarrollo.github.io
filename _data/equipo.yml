    - "A la par con su trabajo académico, Mauricio Reina ha desarrollado una labor permanente como comentarista en medios de comunicación, donde se ha desempeñado como Asesor de la Revista Semana, columnista del diario Portafolio, crítico de cine del diario El Tiempo y analista del noticiero Red Más Noticias, entre otros."

