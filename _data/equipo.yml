# firmas: cómo aparece el nombre en las publicaciones, para listarlas en el perfil.

- nombre: "Marcela Meléndez"
  cargo: "Directora Ejecutiva"
  grupo: direccion
  area: ""
  slug: marcela-melendez
  firmas: ["Marcela Meléndez"]
  foto: "https://res.cloudinary.com/dleuipkoh/image/upload/q_auto/f_auto/v1776446980/WhatsApp_Image_2026-04-17_at_12.29.11_PM_nlhecj.jpg"
  bio:
    - "Marcela Meléndez es la directora ejecutiva de Fedesarrollo, el centro de pensamiento con mayor influencia en el debate de política pública en Colombia y uno de los más prestigiosos de la región. Antes fue economista jefe adjunta para América Latina y el Caribe en el Banco Mundial, economista jefe para América Latina y el Caribe en el Programa de las Naciones Unidas para el Desarrollo (PNUD) y socia directora de ECONESTUDIO, una firma colombiana de consultoría en política pública. A lo largo de su carrera, ha liderado y formado parte de grandes agendas de producción de conocimiento en asuntos centrales para el desarrollo, como el crecimiento económico, la desigualdad y el crimen y la violencia, esta última con foco en el crimen organizado. Su trabajo se encuentra publicado en libros y revistas especializadas. También ha sido profesora en la Universidad de los Andes, ha formado parte de varias comisiones de expertos y de juntas directivas en Colombia, y es columnista de El Tiempo. Tiene un doctorado en economía de Yale University."

- nombre: "Margarita María Rueda Pinzón"
  cargo: "Directora Administrativa y Financiera, Secretaria General"
  grupo: direccion
  area: ""
  slug: margarita-maria-rueda-pinzon
  firmas: ["Margarita María Rueda Pinzón"]
  foto: "https://res.cloudinary.com/dh4bf24wb/image/upload/q_auto/f_auto/v1781760327/plano_medio_qmz19z.jpg"
  correo: secgeneral@fedesarrollo.org.co
  bio:
    - "Margarita es Ingeniera de Sistemas y Administradora de Empresas de la Universidad de los Andes, con un MBA de la misma universidad y un Magíster en Administración de Negocios Globales (GMBA) de la A.B. Freeman School of Business de Tulane University. Con más de 18 años de experiencia liderando planeación estratégica, gestión financiera y dirección de proyectos en los sectores educativo, financiero y público. Entre sus logros más recientes destacan su labor como Rectora del Gimnasio Los Portales y como Decana de Ingeniería y Ciencias Exactas de la Universidad Sergio Arboleda, donde lideró procesos de acreditación de alta calidad y la transformación digital de los programas académicos. También se desempeñó como asesora en la Secretaría de Educación del Distrito y ha sido miembro de las juntas directivas de Cintel y la Corporación Colombia Digital."

