- nombre: "Nicolás Peña Tenjo"
  cargo: "Investigador"
  grupo: investigacion
  area: "seguridad-y-justicia"
  slug: nicolas-pena-tenjo
  firmas: ["Nicolás Peña", "Nicolás Peña-Tenjo", "Nicolas Peña"]
  foto: "https://res.cloudinary.com/dleuipkoh/image/upload/q_auto/f_auto/v1776455669/Eventos%20-%20Fedesarrollo/Image_vctn1g.jpg"
  correo: npena@fedesarrollo.org.co
  bio:
    - "Es economista de la Universidad de los Andes con maestrías en Economía (Uniandes) y en Investigación en Economía y Finanzas (Universidad Bocconi). Su trabajo se concentra en temas de crimen y violencia, y de desarrollo rural. Fue investigador en la Universidad de Stanford y ha enseñado en la Universidad de los Andes y la Universidad del Rosario. En el sector público, se desempeñó como Director de Pequeña Agricultura en el Ministerio de Agricultura y trabajó en la sección de comercio internacional de la Embajada de Colombia en Corea del Sur. Dirigió la Comisión Intersectorial de Seguridad Alimentaria y Nutricional y la Mesa Técnica Nacional de Compras Públicas Locales de Alimentos, y fue miembro del Consejo Directivo de la Unidad Administrativa Especial de Alimentación Escolar y de la Mesa de Negociación del Salario Mínimo. Ha sido consultor del Banco Mundial, el BID, el PNUD, UNU-WIDER y la Friedrich Ebert Stiftung."

- nombre: "Daniel Wiesner"
  cargo: "Investigador asociado"
  grupo: investigacion
  area: ""
  slug: daniel-wiesner
  firmas: ["Daniel Wiesner"]
  foto: "https://res.cloudinary.com/dleuipkoh/image/upload/v1737070852/Personas/WhatsApp_Image_2025-01-16_at_12.22.07_PM_y58921.jpg"
  cv: "https://drive.google.com/file/d/1aHnaEGLuH_Jdc69M58sB1wTqjN7PAncJ/view?usp=sharing"
  bio:
    - "Daniel Wiesner es economista de La Universidad de los Andes y tiene un M.Sc. en Historia Global de la London School of Economics. Se especialista en evaluación y monitoreo de políticas públicas y proyectos de desarrollo. Su experiencia se centra en desarrollo económico rural, cadenas de valor agrícola, sustitución de cultivos ilícitos, crédito y finanzas en ruales, deforestación y fortalecimiento institucional."
    - "Ha liderado proyectos multidisciplinarios integrando análisis estadístico, datos de sistemas de información geográfica (SIG) y metodologías cualitativas en Colombia y América Latina. Ha trabajado como consultor para instituciones internacionales como USAID, el Fondo Internacional de Desarrollo Agrícola (FIDA), la AFD y la GIZ, contribuyendo en evaluaciones estratégicas en América Latina y el Caribe. También ha asesorado a instituciones financieras en mitigación de riesgos territoriales y ha participado en el diseño y la evaluación de políticas de desarrollo territorial en Bogotá y en Colombia."
    - "Daniel es autor de artículos en revistas académicas y ha desarrollado metodologías para el monitoreo de indicadores locales utilizando imágenes satelitales y datos geoespaciales."

- nombre: "David Forero"
  cargo: "Investigador asociado"
  grupo: investigacion
  area: ""
  slug: david-forero
  firmas: ["David Forero"]
  foto: "https://res.cloudinary.com/dleuipkoh/image/upload/v1677556708/Personas/David_Fernando_Forero_lsxwje.png"
  correo: dforero@fedesarrollo.org.co
  bio:
    - "David Forero es Economista de la Universidad Nacional, con maestría en Administración Pública en el London School of Economics. Candidato a PhD en Historia Económica en la Universidad Carlos III de Madrid. Ganador del premio Luis Carlos Sarmiento Angulo 2018, otorgado bianualmente por ANIF, con el cual desarrolló una propuesta de política educativa para mejorar la calidad del sistema de educación preescolar, básica y media en Colombia, “Los diez pasos para volver a Colombia la mejor educada de América Latina”."
    - "Es investigador en Fedesarrollo en temas de política fiscal, eficiencia fiscal, mercado laboral, sistema pensional, calidad educativa, tanto de educación Básica como Superior, y seguridad social. Maneja el Modelo de Equilibrio General de Fedesarrollo. Desarrolló junto a Leonardo Villar, Ex-director de Fedesarrollo una propuesta de reforma pensional Multipilar para Colombia. Fue Director de Calidad de Educación Superior en el Ministerio de Educación Nacional y coordinador del grupo de planeación estratégica para la educación superior de la Oficina de Planeación del Ministerio de Educación Nacional. Ganador del premio Germán Botero de los Ríos 2010, por una investigación sobre la mejor forma de aprovechar la bonanza minero-energética en Colombia. Es profesor de Desarrollo Económico para la maestría en Economía de la Universidad Nacional."

