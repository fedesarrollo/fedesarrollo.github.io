- nombre: "Jairo Núñez"
  cargo: "Investigador asociado"
  grupo: investigacion
  area: ""
  slug: jairo-nunez
  firmas: ["Jairo Núñez"]
  foto: "https://res.cloudinary.com/dleuipkoh/image/upload/v1677557000/Personas/Jairo_N%C3%BA%C3%B1ez_Mendez_bgzmz3.png"
  correo: jnunez@fedesarrollo.org.co
  cv: "https://drive.google.com/file/d/119vyAoqrNKA4YTrJGOjcJBRu4REi6z4-/view?usp=sharing"
  bio:
    - "Ingeniero Civil con maestría en Economía y Candidato a PhD en Ciencias Sociales y Humanas. Ha sido docente de la Universidad Javeriana, Santo Tomás y de los Andes. En el sector público se ha desempeñado como Director de Sistemas en el Distrito Capital, asesor dela Direcciónde Estudios Económicos y Director de Desarrollo Social del Departamento Nacional de Planeación; además fue Viceministro Técnico del Ministerio de la Protección Social y dirigió la Misión de Reducción de la Pobreza entre 2006 y 2008."
    - "En el sector privado ha sido investigador en el CEDE de la Universidad de los Andes y en el Centro Nacional de Consultoría. Ha sido autor y coautor (al lado de los más destacados académicos nacionales e internacionales) de más de sesenta publicaciones sobre, entre otros temas, educación, salud, mercado laboral, protección social, distribución del ingreso y pobreza. Como consultor privado ha sido asesor del PNUD, CEPAL, Banco Mundial, IFC, BID y la CAF y tiene amplia experiencia en evaluaciones cuantitativas de impacto y cualitativas del sector social. Actualmente es investigador de Fedesarrollo, asesora al gobierno nacional en los temas sociales y es profesor de la Universidad Javeriana."

- nombre: "Juan Benavides Estévez-Bretón"
  cargo: "Investigador asociado"
  grupo: investigacion
  area: ""
  slug: juan-benavides-estevez-breton
  firmas: ["Juan Benavides"]
  foto: "https://res.cloudinary.com/dleuipkoh/image/upload/v1677557179/Personas/jb_s3q6mh.png"
  bio:
    - "Ph.D. en Economía Minera (Penn State University). Ha sido Vicedecano de Investigación de la Facultad de Ingeniería y Director del Centro Interdisciplinario de Estudios sobre el Desarrollo (Cider) de la Universidad de los Andes. Ha sido asesor de la Comisión de Regulación de Energía y Gas (Creg)."
    - "Fue Especialista Senior de Infraestructura del Banco Interamericano de Desarrrollo (BID) en Washington. Ha publicado artículos en revistas indexadas como IEEE Transactions on Power Systems, Journal of Construction Engineering and Management, Journal of Regulatory Economics, Journal of Regional Science, Resource and Energy Economics, Global Economy Journal y Journal of Business Research. Ha editado libros y ha escrito capítulos de libros en Stanford University Press, The Johns Hopkins University Press, y el BID, entre otros."
    - "Es consultor internacional en diseño de políticas, regulación, contratos, evaluación financiera e incentivos en energía, transporte, telecomunicaciones y agua potable; y en economía geográfica, recursos naturales y gestión de riesgo de desastres. En los campos anteriores, tiene experiencia de trabajo en 14 países. Hace parte del Consejo de Estructuración de la Agencia Nacional de Infraestructura (ANI)."

- nombre: "Juan Gonzalo Zapata"
  cargo: "Investigador asociado"
  grupo: investigacion
  area: ""
