- numero: "01"
  tipo: documento
  titulo: "La creciente amenaza del crimen organizado en América Latina y el Caribe"
  autores: "Marcela Meléndez, Nicolás Peña-Tenjo, Ernesto Schargrodsky y Juan Vargas"
  fecha: "2026-01"
  resumen: "En este documento de política se examina la magnitud y la naturaleza del crimen organizado en América Latina y el Caribe (ALC), destacando su carácter singularmente violento."
  portada: /assets/img/oac/01.jpg
  pagina: 1
  pdf:
    es: c52075432a9b40b493907bfa7a6069fd
    en: b9d4d21e0f434b0b9f1bd8b94b0380db
    pt: b8acd27844ef43f29fd503614239b15c
  resumen_completo: "En este documento de política se examina la magnitud y la naturaleza del crimen organizado en América Latina y el Caribe (ALC), destacando su carácter singularmente violento. Proponemos una métrica novedosa: el exceso de violencia letal, que subraya cómo la región se destaca a nivel mundial en términos de violencia criminal. El crimen organizado en ALC socava significativamente el crecimiento, la productividad y la movilidad social, reforzando las trampas de la pobreza y la desigualdad. En ese sentido, argumentamos que, aunque la erradicación del crimen organizado es poco probable —del mismo modo que los países desarrollados conviven con estructuras mafiosas arraigadas—, los países que ya lidian con el crimen organizado consolidado, así como aquellos donde las redes criminales todavía no se han enraizado plenamente, aún tienen una ventana de oportunidad para contener sus efectos más perjudiciales. En este documento se exponen cuatro prioridades políticas que son críticas para la región: a) la reforma penitenciaria para enfrentar su naturaleza criminogénica; b) la mejora de la formación y la coordinación dentro de las fuerzas policiales, y entre las distintas agencias de seguridad y cumplimiento de la ley; c) el fortalecimiento de la eficacia del sistema judicial, reduciendo la impunidad y definiendo prioridades estratégicas, y d) la coordinación y colaboración internacionales. Asimismo, enfatizamos el valor de los esfuerzos de investigación emergentes que combinan datos detallados con un profundo conocimiento contextual de la dinámica local de ALC, con el fin de orientar soluciones de política pública más eficaces y accionables. 01"

- numero: "02"
  tipo: documento
  titulo: "Drogas y políticas de drogas en América Latina: éxitos, fracasos y extravíos"
  autores: "Daniel Mejía"
  fecha: "2026-01"
  resumen: "Este documento analiza la evolución del narcotráfico, sus vínculos con el crimen organizado y las políticas antidrogas en América Latina en las últimas décadas."
  portada: /assets/img/oac/02.jpg
  pagina: copy-of-new-page
  pdf:
    es: 28391b14593746a9b47ba68dc9925d1a
    en: 3239679a51294aba8bf0eb94d2e308f6
    pt: 4c8f245d428a4af9a5b23baedcf1f906
  resumen_completo: "Este documento analiza la evolución del narcotráfico, sus vínculos con el crimen organizado y las políticas antidrogas en América Latina en las últimas décadas. El análisis muestra un aumento histórico en los últimos 10 años en la producción de cocaína, el ascenso de los opioides sintéticos como el fentanilo y la expansión de la producción de metanfetaminas. A pesar de décadas de estrategias orientadas a reducir la oferta de drogas —incluyendo la erradicación de cultivos, la interdicción, la militarización y la guerra frontal contra el narcotráfico y las organizaciones criminales vinculadas a esta actividad ilegal—, la producción y el tráfico de drogas en la región han alcanzado máximos históricos, desplazándose geográficamente y adaptándose tecnológicamente a las políticas de reducción de oferta implementadas en los diferentes países. La evidencia empírica muestra que las políticas prohibicionistas han tenido efectos limitados sobre la disponibilidad de drogas y, en cambio, han generado altos efectos colaterales, entre ellos elevados niveles de violencia, corrupción y debilitamiento institucional. En este documento se examina también cómo las organizaciones criminales vinculadas al narcotráfico han evolucionado, diversificándose hacia nuevas actividades ilícitas. Asimismo, se analizan los patrones de consumo en América Latina, que muestran un preocupante aumento en la prevalencia del consumo de sustancias como marihuana, cocaína y drogas sintéticas, particularmente entre los jóvenes. Por último, se presenta una reflexión sobre la necesidad de un cambio de paradigma en las políticas antidrogas, que implique abandonar los enfoques estrictamente represivos en favor de estrategias basadas en la evidencia. Estas deberían combinar políticas de seguridad inteligentes y de disuasión focalizada, reducción de daños, fortalecimiento institucional, regulación de mercados y enfoques de salud pública, para abordar de manera más eficaz las complejas dinámicas del narcotráfico y el crimen organizado en la región. 02"

- numero: "03"
  tipo: documento
  titulo: "¿De escuelas de crimen a centros criminales? Las cárceles y el crimen organizado en América Latina y el Caribe"
  autores: "Ernesto Schargrodsky y Santiago Tobón"
  fecha: "2026-01"
  resumen: "En este documento se analiza la situación actual de las cárceles en América Latina y el Caribe. Muchas cárceles de nuestra región han dejado de ser centros de detención neutrales y, en cambio, operan como centros de reclutamiento, nodos financieros y puestos de comando para las principales organizaciones criminales de la región."
  portada: /assets/img/oac/03.jpg
  pagina: 3
  pdf:
    es: 4c673eee27d9455b9be08fc5e6834e21
    en: 763a4aa502884c0ca95ca8b13bd359b3
    pt: 817ee65e2cb249199e3f0146b7513e9a
  resumen_completo: "En este documento se analiza la situación actual de las cárceles en América Latina y el Caribe. Muchas cárceles de nuestra región han dejado de ser centros de detención neutrales y, en cambio, operan como centros de reclutamiento, nodos financieros y puestos de comando para las principales organizaciones criminales de la región. Sobre la base de datos comparativos, estudios de caso y trabajos académicos previos, documentamos cuatro mecanismos que convierten a las cárceles superpobladas y débilmente supervisadas en “centros criminales”: el reclutamiento de nuevos miembros, la extracción de ingresos ilícitos, la coordinación de actos de violencia y alianzas, y la imposición de disciplina interna. Luego explicamos por qué estas dinámicas erosionan las tres justificaciones clásicas del encarcelamiento. La incapacitación falla cuando los jefes dirigen redes de extorsión y tráfico desde sus celdas; la disuasión falla cuando el tiempo en prisión es un hito esperado en la carrera de una pandilla, y la resocialización falla cuando la supervivencia tras las rejas depende de unirse a un grupo criminal. Por último, se esboza un programa de políticas que reserva el encarcelamiento para los criminales; sustituye la detención por el monitoreo electrónico y otras sanciones comunitarias para casos de bajo riesgo; invierte en instalaciones mejor administradas que ofrecen condiciones de vida dignas; acelera los juicios para reducir la prisión preventiva; ofrece oportunidades de resocialización basadas en evidencias, como programas cognitivoconductuales, vocacionales y educativos, e interrumpe las comunicaciones ilícitas mediante una estricta supervisión del personal y el uso de la tecnología. Implementadas en conjunto, estas medidas pueden debilitar el control del crimen organizado sobre los sistemas penitenciarios y restaurar el papel de las cárceles en la seguridad pública. 03"

- numero: "04"
  tipo: documento
  titulo: "Gobernanza criminal en América Latina"
  autores: "Ana Arjona y Andreas E. Feldmann"
  fecha: "2026-01"
  resumen: "La gobernanza criminal—entendida como la regulación del comportamiento de población a nivel local por parte de un grupo de crimen organizado— se ha convertido en uno de los desafíos más importantes que enfrentan las sociedades latinoamericanas contemporáneas."
  portada: /assets/img/oac/04.jpg
  pagina: 4
  pdf:
    es: 673dfdbfa4914277b3e4389afbab5a45
    en: 7cdf1f3275f74a3596f732bcd04fcdec
    pt: b215d1f0e2e54f3cbe544ea1a886ccf8
  resumen_completo: "La gobernanza criminal—entendida como la regulación del comportamiento de población a nivel local por parte de un grupo de crimen organizado— se ha convertido en uno de los desafíos más importantes que enfrentan las sociedades latinoamericanas contemporáneas. En las áreas donde operan grupos criminales, éstos a menudo regulan la vida económica, social y política, estableciendo instituciones paralelas, resolviendo conflictos, extrayendo ingresos y ofreciendo seguridad y servicios. La gobernanza criminal, que antes se asociaba principalmente con Estados frágiles, se ha extendido a una amplia gama de contextos, incluidos Estados relativamente fuertes y democráticos en América Latina. En este documento de política se sintetizan tres décadas de investigación interdisciplinaria sobre el tema, basada en 169 estudios académicos publicados desde 1990 y el trabajo de campo original realizado por los autores en varios países latinoamericanos. En él se explica cómo gobiernan los grupos criminales; se presentan teorías contrapuestas sobre cuándo y por qué asumen funciones de gobernanza, y se evalúan las consecuencias sociales, políticas y económicas de estos regímenes locales. A su vez, se examina la evidencia disponible sobre las principales respuestas normativas —como la militarización, las intervenciones de base comunitaria y la negociación—, y se destacan sus fortalezas, limitaciones y efectos no deseados. El documento concluye con una serie de recomendaciones para diseñar políticas más eficaces que permitan hacer frente a la gobernanza criminal y mitigar sus daños. También se describen posibles vías para futuras investigaciones y la recopilación de datos. 04"

- numero: "05"
  tipo: documento
  titulo: "El complejo vínculo entre la migración y el crimen organizado en América Latina y el Caribe"
  autores: "Juan Vargas, María Micaela Sviatschi y Nicolás Cabra-Ruiz"
  fecha: "2026-01"
  resumen: "Este documento examina la relación de refuerzo mutuo entre la migración y el crimen organizado en América Latina y el Caribe. Sostenemos que la movilidad y la gobernanza criminal son parte de un sistema interdependiente en el que el crimen organizado genera desplazamientos mediante la violencia, la extorsión y el control territorial, mientras que los flujos migratorios crean nuevas rutas para que los actores criminales se expandan geográficamente, así como nuevos mercados que explotan para obtener ganancias."
  portada: /assets/img/oac/05.jpg
  pagina: 5
  pdf:
    es: fc3ce295c25b432487d8e0f2bf54d2c2
    en: 5d164116516c40719b0e86902d27c0b9
    pt: d6f442fea1f64a7baa731d30d65858c5
  resumen_completo: "Este documento examina la relación de refuerzo mutuo entre la migración y el crimen organizado en América Latina y el Caribe. Sostenemos que la movilidad y la gobernanza criminal son parte de un sistema interdependiente en el que el crimen organizado genera desplazamientos mediante la violencia, la extorsión y el control territorial, mientras que los flujos migratorios crean nuevas rutas para que los actores criminales se expandan geográficamente, así como nuevos mercados que explotan para obtener ganancias. Proponemos un marco conceptual novedoso para dar cuenta de este ciclo de retroalimentación y analizamos la evidencia empírica disponible a través de esta perspectiva, lo que nos permite formalizar los mecanismos que vinculan la migración y el crimen organizado y orientar posibles líneas de política pública. Si bien la evidencia sugiere que los migrantes, como individuos, son en gran medida víctimas del crimen organizado, la movilidad a gran escala también puede facilitar la expansión de las organizaciones criminales. Planteamos la hipótesis de que, al reforzar las narrativas incompletas que asocian la migración con la inseguridad, estas últimas dinámicas tienden a prevalecer sobre las primeras en la configuración de las percepciones públicas en la región y fomentan políticas restrictivas que aumentan la irregularidad y la exposición de los migrantes a la depredación. Así mismo,mostramos que las campañas de información pueden corregir en forma parcial percepciones aparentemente sesgadas, y que el diseño de política media de manera crucial el nexo entre migración y crimen. Específicamente, los programas de regularización y protección pueden reducir la vulnerabilidad de los migrantes y las ganancias del crimen organizado, mientras que las estrategias de disuasión y exclusión pueden fortalecer los mercados ilícitos. Las conclusiones subrayan la necesidad de respuestas regionales coordinadas que combinen una gestión migratoria basada en los derechos con el fortalecimiento de la capacidad estatal para enfrentar al crimen organizado. 05"

- numero: "06"
  tipo: documento
  titulo: "El papel del sistema financiero en las organizaciones criminales, el lavado de dinero y el diseño de políticas contra el lavado de dinero: cómo lograr un equilibrio entre la persecución penal y la prevención"
  autores: "Alejandro Werner y Roberto de Michele"
  fecha: "2026-01"
  resumen: "Las organizaciones criminales dependen del sistema financiero para movilizar y utilizar sus ganancias ilícitas, encubriéndolas mediante un proceso conocido como “lavado de dinero”."
  portada: /assets/img/oac/06.jpg
  pagina: 6new
  pdf:
    es: 295af25e09ca4e7f8398a24a8dfb85c7
    en: 4fbf5c88ed16471091279f8284c8d4a7
    pt: 191acc516b7043488cd0718a10184237
  resumen_completo: "Las organizaciones criminales dependen del sistema financiero para movilizar y utilizar sus ganancias ilícitas, encubriéndolas mediante un proceso conocido como “lavado de dinero”. Los fondos ilícitos procedentes de actividades delictivas primero se mezclan con los ingresos comerciales legítimos y luego se transfieren y estratifican a través del sistema financiero para ocultar su origen. El marco global contra el lavado de activos y el financiamiento del terrorismo (ALA/CFT), establecido por el Grupo de Acción Financiera Internacional (GAFI) fue diseñado originalmente para facilitar la persecución del lavado de dinero y otros delitos conexos, especialmente el narcotráfico. Como resultado, muchos países adoptaron marcos centrados principalmente en las investigaciones penales. Si bien este enfoque sigue siendo importante, se ve dificultado por varios factores, entre ellos delincuentes cada vez más sofisticados que capturan mercados legítimos y, en América Latina y el Caribe (ALC), grandes economías informales y un uso intensivo del efectivo. Las unidades de inteligencia financiera (UIF) ocupan un lugar central en estos marcos y desempeñan un papel clave a la hora de recopilar, analizar y compartir información sobre actividades sospechosas. Sin embargo, el aumento de las cargas operativas y de los requerimientos de otros organismos ha desviado su atención del análisis estratégico y la retroalimentación al sector privado. En este documento se sostiene que el modelo tradicional centrado en la persecución penal pasa por alto el valor de un enfoque estratégico y preventivo de lucha contra el lavado de dinero (ALD). Esta estrategia permitiría “gravar” la actividad delictiva al dificultar y encarecer el uso del sistema financiero por parte de los delincuentes (a través de mejoras en la detección, las sanciones y el diseño del sistema), al tiempo que minimizaría las cargas para los usuarios legítimos. Se propone, entonces, inclinar la balanza a favor de medidas de política preventivas, especialmente el uso de tecnologías digitales para mejorar el cumplimiento y reducir los costos. Estas medidas están destinadas a complementar, no a reemplazar, la persecución penal. En última instancia, en este documento se examina por qué el ALD es importante, cómo ha evolucionado el marco, los desafíos en ALC, los límites del modelo centrado en la persecución penal y las opciones de política para fortalecer la prevención. 06"

- numero: "07"
  tipo: documento
  titulo: "Estrategias policiales contra el crimen organizado en América Latina"
  autores: "Michael Weintraub y Joana Monteiro"
  fecha: "2026-01"
  resumen: "Este documento de política analiza las estrategias de seguridad policial para enfrentar el crimen organizado en América Latina. A partir de la síntesis de evidencia comparada, concluye que los operativos militarizados y la focalización en líderes criminales suelen generar beneficios de corta duración o incluso exacerbar la violencia, mientras que los enfoques selectivos y basados en inteligencia muestran mayor potencial, especialmente cuando se combinan con reformas institucionales."
  portada: /assets/img/oac/07.jpg
  pagina: 7
  pdf:
    es: eac6fbd365b84f868b0aa41191040d4f
    en: 8151d22b593c4b0795b6f139c3988c27
    pt: 2fad47a79cab4c039af6fda9528dcf8a
  resumen_completo: "Este documento de política analiza las estrategias de seguridad policial para enfrentar el crimen organizado en América Latina. A partir de la síntesis de evidencia comparada, concluye que los operativos militarizados y la focalización en líderes criminales suelen generar beneficios de corta duración o incluso exacerbar la violencia, mientras que los enfoques selectivos y basados en inteligencia muestran mayor potencial, especialmente cuando se combinan con reformas institucionales. El documento propone sustituir las métricas tradicionales de resultados —como el número de detenciones o decomisos de drogas— por indicadores que prioricen la reducción del daño, las restricciones a la gobernanza criminal y el fortalecimiento de la confianza pública. Finalmente, presenta recomendaciones de política centradas en la rendición de cuentas, la coordinación interinstitucional y la supervisión democrática. 07"

- numero: "08"
  tipo: documento
  titulo: "Sistemas de justicia y crimen organizado en América Latina: cinco ejes de mejora"
  autores: "Laboratorio de Justicia y Política Criminal"
  fecha: "2026-01"
  resumen: "Este documento plantea que la ineficacia de los sistemas de justicia de América Latina para enfrentar el crimen organizado no obedece primordialmente a la escasez de recursos, sino a una gestión poco estratégica que suele privilegiar respuestas punitivas individuales por sobre el impacto estructural."
  portada: /assets/img/oac/08.jpg
  pagina: 8
  pdf:
    es: 301a4dbad69741898ef4425e5f48d2ed
    en: 4597d55006dc443d83e7bf94cb019156
    pt: d7b284fa75be45408394f4f0464e42bc
  resumen_completo: "Este documento plantea que la ineficacia de los sistemas de justicia de América Latina para enfrentar el crimen organizado no obedece primordialmente a la escasez de recursos, sino a una gestión poco estratégica que suele privilegiar respuestas punitivas individuales por sobre el impacto estructural. El diagnóstico identifica una carencia crítica de datos empíricos y señala que las reformas procesales previas han tenido poco éxito tanto en el incremento de la sanción penal por delitos graves como en la desarticulación de redes criminales complejas, limitándose a menudo a judicializaciones por flagrancia de bajo valor estratégico. Ante este panorama, el documento propone cinco ejes de mejora: i) la focalización estratégica de la persecución penal en delitos de alto impacto, ii) el fortalecimiento de la articulación interinstitucional, iii) la implementación de macroinvestigaciones que trasciendan los hechos aislados para comprender patrones y estructuras criminales, iv) la optimización de la cooperación entre jurisdicciones, y v) el diseño de marcos jurídicos robustos para la justicia premial y el sometimiento colectivo de organizaciones criminales. En conjunto, la propuesta aboga por una política criminal estratégica y basada en evidencia, que priorice la disuasión de la violencia, el desafío al Estado y los daños ambientales graves, mediante un uso focalizado, coordinado y transparente de las capacidades represivas del Estado. 08"

- numero: "09"
  tipo: documento
  titulo: "Educación y caminos de los jóvenes bajo el crimen organizado"
  autores: "Martín Vanegas-Arias y Santiago Tobón"
  fecha: "2026-06"
  resumen: "Los homicidios de jóvenes en América Latina y el Caribe (ALC) alcanzan tasas más de 10 veces superiores a las de Europa y Asia central. La exclusión educativa durante la adolescencia sigue siendo desproporcionadamente alta en los mismos países de ALC donde el crimen organizado recluta activamente a jóvenes."
  portada: /assets/img/oac/09.jpg
  pagina: copy-of-8
  pdf:
    es: 7655bb8912c249b0a342d8f298b350af
    en: 8486d989ac9c4b45aff5f209315437df
    pt: 7577a15d800b4ef199fa19ceb1609e2f
  resumen_completo: "Los homicidios de jóvenes en América Latina y el Caribe (ALC) alcanzan tasas más de 10 veces superiores a las de Europa y Asia central. La exclusión educativa durante la adolescencia sigue siendo desproporcionadamente alta en los mismos países de ALC donde el crimen organizado recluta activamente a jóvenes. En este documento de política se examina evidencia experimental y cuasiexperimental sobre intervenciones educativas y de desarrollo juvenil que inciden en desenlaces violentos y antisociales, y se evalúa si estos resultados pueden ser tenidos en cuenta para formular estrategias de prevención en contextos de crimen organizado. Organizamos la evidencia en torno a tres mecanismos —acumulación de capital humano, efectos de red de pares y autorregulación— y rastreamos cómo opera cada uno a lo largo del ciclo de vida: primera infancia, adolescencia temprana y adolescencia tardía. Los hallazgos incluyen: (i) los programas de terapia cognitivo-conductual dirigidos reducen los arrestos por delitos violentos entre adolescentes de alto riesgo; (ii) las prácticas de justicia restaurativa en las escuelas reducen los arrestos y suspensiones sin aumentar el desorden; (iii) las reformas de escolaridad obligatoria y la prevención de la deserción escolar reducen el encarcelamiento de los alumnos marginales, y (iv) las transferencias condicionadas que mantienen a los niños en la escuela compensan la entrada temprana en mercados laborales ilegales. La mayor parte de esta evidencia mide resultados generales de la justicia penal en lugar de resultados específicos del crimen organizado, como el reclutamiento, la persistencia o la salida. Identificamos las condiciones en las que la extrapolación de la delincuencia general a contextos de crimen organizado se fortalece o debilita, y proponemos un paquete de políticas priorizadas que combina incentivos a la asistencia, tutorías en dosis altas, capacitación en habilidades conductuales y reforma del clima escolar. Las intervenciones educativas pueden reducir el número de adolescentes vulnerables al reclutamiento y disminuir los comportamientos violentos, pero no pueden sustituir las medidas sobre el control territorial, la corrupción o la rentabilidad de los mercados ilegales. La prevención eficaz requiere estrategias de educación integradas en marcos institucionales y de seguridad más amplios. 09"

- numero: "10"
  tipo: documento
  titulo: "El arraigo del crimen organizado en las comunidades locales de América Latina"
  autores: "Elena Butti y Albert Souza Mulli"
  fecha: "2026-06"
  resumen: "En este documento de política se examinan los diferentes enfoques que utilizan los grupos del crimen organizado en América Latina y el Caribe (ALC) para integrarse en las comunidades locales."
  portada: /assets/img/oac/10.jpg
  pagina: copy-of-9
  pdf:
    es: ea005831b431477d8517c24a3182971f
    en: ea973182467445538b95c4742cc499f1
    pt: 3e670233f45e4c8298e6b5861be9288c
  resumen_completo: "En este documento de política se examinan los diferentes enfoques que utilizan los grupos del crimen organizado en América Latina y el Caribe (ALC) para integrarse en las comunidades locales. Sobre la base de una revisión sistemática de literatura académica y gris, en el documento de política se argumenta que las tasas de homicidio y otros indicadores de violencia a menudo tienen limitaciones para dar cuenta del grado de arraigo criminal, ya que los grupos del crimen organizado suelen establecer y consolidar relaciones con las comunidades locales (y el Estado) a través de una variedad de diferentes prácticas que responden a las necesidades económicas y de gobernanza de las comunidades. Para explorar estas dinámicas, el documento de política propone un marco analítico que identifica tres ámbitos de interacción distintos pero con superposiciones entre el crimen organizado y la comunidad: el ámbito regulatorio (incluidas resolución de disputas, regulación moral y justicia informal), el ámbito económico (provisión de empleo, servicios, acceso a mercados informales e ilícitos, y funciones similares a la asistencia social) y el ámbito político-cívico (infiltración en la política local, los procesos electorales y la regulación de la sociedad civil). El análisis muestra que estas prácticas suelen generar formas de legitimidad local y contratos sociales que desdibujan los límites entre la autoridad estatal y la no estatal, la legalidad y la ilegalidad, y la coerción y el consentimiento, y que los grupos del crimen organizado suelen asumir funciones tradicionalmente asociadas con el Estado para ganar legitimidad y hacer cumplir el orden local. Se demuestra además que los grupos criminales pueden hacer esto no solo debido a la ausencia del Estado —como se asume con frecuencia—, sino a menudo a través de la colusión con las instituciones estatales y la cooptación de las mismas. Sobre la base del análisis, se examina la evidencia disponible sobre intervenciones de política pública empíricamente prometedoras para interrumpir o prevenir la expansión territorial del crimen organizado en los tres ámbitos. La evidencia sugiere que los enfoques tradicionales y securitizados, que buscan interrumpir y \"desplazar\" al crimen organizado al \"traer de vuelta al Estado\", a menudo pueden profundizar su arraigo en las comunidades locales e incluso empeorar la violencia. En cambio, el documento concluye que para aumentar la eficacia se requieren enfoques más selectivos y secuenciales, que diferencien entre distintos tipos de grupos criminales y se centren en reducir la dependencia de las comunidades con respecto a ellos. 10"

- numero: "11"
  tipo: documento
  titulo: "Disponibilidad de armas de fuego, crimen organizado y niveles de violencia en América Latina"
  autores: "Daniel Mejía e Isabella Serrano"
  fecha: "2026-06"
  resumen: "La disponibilidad generalizada de armas de fuego ilegales potencia la criminalidad y la violencia en América Latina y el Caribe. Este estudio revisa la evidencia sobre el vínculo entre la proliferación de armas de fuego, el crimen organizado y los niveles de violencia en la región."
  portada: /assets/img/oac/11.jpg
  pagina: copy-of-9-1
  pdf:
    es: 39a26cfb475949afbc01af05e380ab19
    en: a643b0d9ef814af683c0caf85e8e98ce
    pt: d8ff7cf0de944f74a91c237936cd2c2b
  resumen_completo: "La disponibilidad generalizada de armas de fuego ilegales potencia la criminalidad y la violencia en América Latina y el Caribe. Este estudio revisa la evidencia sobre el vínculo entre la proliferación de armas de fuego, el crimen organizado y los niveles de violencia en la región. Los hechos estilizados y la evidencia empírica muestran una fuerte correlación entre la proliferación de armas y las tasas de homicidio. Aunque la evidencia sobre causalidad es limitada, los estudios que han abordado esta pregunta sugieren que una mayor disponibilidad de armas incrementa la violencia homicida. Persisten, no obstante, vacíos de conocimiento que requieren mejores datos y más investigación sobre la disponibilidad y los mercados de armas ilícitas. El trabajo también examina cómo los grupos criminales aprovechan el acceso a armas para afianzar su control territorial y escalar distintas formas de violencia, y cómo la convergencia de estos grupos con el narcotráfico alimenta circuitos de “drogas por armas” que intensifican la violencia y la gobernanza criminal. Frente a ello, se enfatiza la necesidad de reforzar la coordinación interna y la cooperación internacional para regular las armas de fuego y sus mercados. Reducir la proliferación ilícita y la violencia exige un enfoque integral que combine medidas inmediatas (operativos de decomiso, campañas de desarme) con reformas estructurales de largo plazo (leyes más estrictas de control de armas, mayores controles fronterizos y de arsenales oficiales, y desarticulación de redes de tráfico). Solo una respuesta sostenida, y articulada entre países, permitirá disminuir de manera durable el flujo ilícito de armas en la región. 11"

- numero: "12"
  tipo: documento
  titulo: "Crimen organizado y derechos humanos en América Latina y el Caribe"
  autores: "Hernán Flom, Leslie MacColman y Marcelo Bergman"
  fecha: "2026-06"
  resumen: "En América Latina y el Caribe, el crimen organizado priva a millones de personas de libertad, seguridad, dignidad, y hasta de sus vidas. Los Estados contribuyen directa e indirectamente al incumplimiento de estos y otros derechos humanos, mediante la protección de actores delictivos, la desprotección de víctimas y testigos, la vulneración de derechos civiles, y la escasa promoción de derechos económicos y sociales."
  portada: /assets/img/oac/12.jpg
  pagina: copy-of-11
  pdf:
    es: f35079b52f9b4683b88235fc4f3d4183
    en: 49b058e036ca47558e2ed9422a688495
    pt: ab78634a8fcf4633bc6dc8ca27cc5e9d
  resumen_completo: "En América Latina y el Caribe, el crimen organizado priva a millones de personas de libertad, seguridad, dignidad, y hasta de sus vidas. Los Estados contribuyen directa e indirectamente al incumplimiento de estos y otros derechos humanos, mediante la protección de actores delictivos, la desprotección de víctimas y testigos, la vulneración de derechos civiles, y la escasa promoción de derechos económicos y sociales. Este documento ofrece un modelo teórico que sintetiza la interrelación entre el Estado y el crimen organizado, en términos de violaciones de derechos humanos. Muestra la aplicabilidad del modelo mediante un análisis regional de la trata de personas y la extorsión, dos actividades criminales predatorias que sostienen y fortalecen a las estructuras criminales mediante el uso de personas vivas como activos comerciales. El documento sintetiza la evidencia empírica y los consensos emergentes sobre cómo combatir al crimen organizado desde un enfoque de derechos humanos y concluye con una serie de recomendaciones de políticas públicas para los Estados nacionales y otros actores centrales en la protección y promoción de los derechos humanos."

- numero: "1"
  tipo: nota
  titulo: "Estudio de caso: estrategia de reducción de delitos de alto impacto de la Ciudad de México 2018-24"
  autores: "LAB-CO"
  fecha: "2026-01"
  resumen: "La Ciudad de México redujo los delitos de alto impacto con liderazgo político sostenido, coordinación entre la Policía y la Fiscalía, y programas de prevención focalizados."
  portada: /assets/img/oac/n1.jpg
  pagina: copy-of-1
  pdf:
    es: 7f3acad6f0d34d988d38e2e2204c4b97
