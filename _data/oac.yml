  mensajes:
    - "La Ciudad de México logró reducir la incidencia de delitos de alto impacto en un 70,1 %."
    - "La Policía fue habilitada, gracias a una reforma legislativa en 2019, para participar en investigaciones penales, lo que permitió una mejor coordinación con la Fiscalía para identificar generadores de violencia y aportar datos de prueba para su persecución penal."
    - "La conducción directa del Gabinete de Seguridad por parte de la Jefatura de Gobierno fue un factor clave para la alineación de prioridades y la coordinación entre instituciones."
  recomendaciones:
    - "Asegurar un liderazgo político sostenido, capaz de conducir la coordinación interinstitucional, alinear prioridades y garantizar recursos y facultades para la estrategia."
    - "Diseñar programas de prevención focalizados en las personas y los grupos de riesgo basados en evidencia."
    - "Habilitar legalmente a las Policías para participar en investigaciones penales, realizar análisis criminal, generar inteligencia y aportar datos de prueba."
