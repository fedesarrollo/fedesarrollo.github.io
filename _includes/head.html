<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo title=false %}
<title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}Fedesarrollo</title>
<link rel="icon" href="{{ '/assets/fede/logos/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" sizes="any">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
{%- if site.fuentes_marca %}
<link rel="preload" href="{{ '/assets/fede/assets/fonts/web/ESFace-Medium.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/fede/web/fuentes-marca.css' | relative_url }}">
{%- else %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
{%- endif %}
<link rel="stylesheet" href="{{ '/assets/fede/web/fedesarrollo.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{%- for css in page.css %}
<link rel="stylesheet" href="{{ css | relative_url }}">
{%- endfor %}
